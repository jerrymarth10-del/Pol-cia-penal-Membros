<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<body class="login-body"><div class="login-shell"><div class="login-card">

<button type="submit" class="primary-btn">Entrar</button><p id="loginMessage" class="login-message"></p>
</form><div class="hint-box">Login visual simples, pronto para GitHub e Vercel.</div></div></div>
